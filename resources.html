<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BCA Study Point</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

<h3>BCA Study Point</h3>

<div class="card p-3 mb-4">
<input type="text" id="title" class="form-control mb-2" placeholder="Title">
<input type="text" id="link" class="form-control mb-2" placeholder="Paste Google Drive / PDF Link">
<button onclick="submitResource()" class="btn btn-primary">Submit</button>
</div>

<div class="row" id="container"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function submitResource(){

const title=document.getElementById("title").value;
const link=document.getElementById("link").value;

if(!title || !link){
alert("Fill all fields");
return;
}

await addDoc(collection(db,"resources"),{
title:title,
link:link
});

alert("Submitted Successfully");

document.getElementById("title").value="";
document.getElementById("link").value="";

loadResources();

}

async function loadResources(){

const container=document.getElementById("container");
container.innerHTML="";

const snapshot=await getDocs(collection(db,"resources"));

snapshot.forEach(doc=>{

const data=doc.data();

container.innerHTML+=`
<div class="col-md-3 mb-3">
<div class="card p-3">
<h6>${data.title}</h6>
<a href="${data.link}" target="_blank" class="btn btn-primary btn-sm mt-2">View</a>
</div>
</div>
`;

});

}

loadResources();

window.submitResource=submitResource;

</script>

</body>
</html>
