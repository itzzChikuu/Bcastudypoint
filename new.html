<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCA Study Point - Admin Approval System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

<style>
body {
  background: #f3f0ff;
  transition: 0.3s;
  font-family: 'Segoe UI', sans-serif;
}

body.dark {
  background: #0f0c1a;
  color: white;
}

/* Sidebar */
.sidebar {
  height: 100vh;
  background: linear-gradient(180deg, #6f42c1, #4b0082);
  color: white;
  padding: 20px;
}

.sidebar h4 {
  font-weight: bold;
}

.sidebar a {
  color: #e0d4ff;
  text-decoration: none;
  display: block;
  margin: 12px 0;
  padding: 8px;
  border-radius: 8px;
  transition: 0.3s;
}

.sidebar a:hover {
  background: rgba(255,255,255,0.2);
  color: white;
}

/* Cards */
.card {
  border-radius: 15px;
  transition: 0.3s;
  border: none;
  background: white;
  box-shadow: 0 8px 20px rgba(111,66,193,0.15);
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 30px rgba(111,66,193,0.25);
}

.dark .card {
  background: #1c1530;
  color: white;
}

/* Buttons */
.btn-primary {
  background: #6f42c1;
  border: none;
}

.btn-primary:hover {
  background: #5a32a3;
}

.btn-success {
  background: #7b2cbf;
  border: none;
}

.btn-success:hover {
  background: #5a189a;
}

.btn-warning {
  background: #9d4edd;
  border: none;
  color: white;
}

.btn-warning:hover {
  background: #7b2cbf;
}

/* Admin badge */
.admin-badge {
  font-size: 12px;
  background: #ff4d6d;
  color: white;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="container-fluid">
<div class="row">

<div class="col-md-2 sidebar">
<h4>BCA Study Point</h4>
<hr>
<a onclick="showApproved()"><i class="fas fa-book"></i> Approved Resources</a>
<a onclick="showPending()"><i class="fas fa-clock"></i> Pending (Admin)</a>
<button class="btn btn-light btn-sm mt-3" onclick="toggleDark()">🌙 Dark Mode</button>
<button class="btn btn-warning btn-sm mt-2" onclick="adminLogin()">Admin Login</button>
<div id="adminStatus" class="mt-2"></div>
</div>

<div class="col-md-10 p-4">
<h2 class="mb-4">Upload (Admin Approval Required)</h2>

<div class="card p-4 mb-4">
<input type="text" id="title" class="form-control mb-2" placeholder="Enter Title" required>
<input type="file" id="file" class="form-control mb-2" required>
<button onclick="submitForApproval()" class="btn btn-primary">Submit</button>
<p class="text-muted mt-2">File will be visible after admin approval.</p>
</div>

<div id="resourceContainer" class="row"></div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let isAdmin = false;

function toggleDark(){ document.body.classList.toggle('dark'); }

function adminLogin(){
const pass = prompt("Enter Admin Password");
if(pass === "admin123"){
isAdmin = true;
document.getElementById('adminStatus').innerHTML = '<span class="admin-badge">ADMIN</span>';
alert("Admin Login Successful");
}else{
alert("Wrong Password");
}
}

// Submit for approval
function submitForApproval(){
const title = document.getElementById('title').value;
const fileInput = document.getElementById('file');
const file = fileInput.files[0];
if(!file || !title) return alert('Fill all fields');

const reader = new FileReader();
reader.onload = function(){
const pending = JSON.parse(localStorage.getItem('pendingResources') || '[]');
pending.push({ title:title, file:reader.result, name:file.name, fileType:file.type });
localStorage.setItem('pendingResources', JSON.stringify(pending));
document.getElementById('title').value='';
fileInput.value='';
alert('Submitted for Admin Approval');
}
reader.readAsDataURL(file);
}
function showApproved(){
const container = document.getElementById('resourceContainer');
container.innerHTML='';
const approved = JSON.parse(localStorage.getItem('approvedResources') || '[]');

approved.forEach((item,index)=>{

container.innerHTML += `
<div class="col-md-3 mb-3">
<div class="card p-3">
<h6>${item.title}</h6>

<div class="mt-2 d-flex justify-content-between">
<button onclick="viewApproved(${index})" class="btn btn-primary btn-sm">View</button>
<button onclick="downloadApproved(${index})" class="btn btn-success btn-sm">Download</button>
</div>

</div>
</div>`;
});
}
function base64ToBlob(base64, type) {
const byteCharacters = atob(base64.split(',')[1]);
const byteNumbers = new Array(byteCharacters.length);
for (let i = 0; i < byteCharacters.length; i++) {
byteNumbers[i] = byteCharacters.charCodeAt(i);
}
const byteArray = new Uint8Array(byteNumbers);
return new Blob([byteArray], { type: type });
}

function viewApproved(index){
const approved = JSON.parse(localStorage.getItem('approvedResources') || '[]');
const item = approved[index];

const blob = base64ToBlob(item.file, item.fileType);
const blobUrl = URL.createObjectURL(blob);

window.open(blobUrl, '_blank');
}

function downloadApproved(index){
const approved = JSON.parse(localStorage.getItem('approvedResources') || '[]');
const item = approved[index];

const blob = base64ToBlob(item.file, item.fileType);
const blobUrl = URL.createObjectURL(blob);

const a = document.createElement('a');
a.href = blobUrl;
a.download = item.name;
a.click();
}

function showPending(){
if(!isAdmin) return alert('Admin Only Section');

const container = document.getElementById('resourceContainer');
container.innerHTML='';
const pending = JSON.parse(localStorage.getItem('pendingResources') || '[]');

pending.forEach((item,index)=>{

let previewContent = '';

if(item.fileType.startsWith('image/')){
previewContent = `<img src="${item.file}" class="img-fluid" style="max-height:200px;">`;
}
else if(item.fileType === 'application/pdf'){
previewContent = `<iframe src="${item.file}" width="100%" height="200px"></iframe>`;
}
else if(item.fileType.startsWith('video/')){
previewContent = `<video controls width="100%" height="200px">
<source src="${item.file}" type="${item.fileType}">
</video>`;
}
else{
previewContent = `<p>Preview not available</p>`;
}

function viewApproved(index){
const approved = JSON.parse(localStorage.getItem('approvedResources') || '[]');
const item = approved[index];

document.getElementById('approvedTitle').innerText = item.title;
const body = document.getElementById('approvedBody');
body.innerHTML='';

if(item.fileType.startsWith('image/')){
body.innerHTML = `<img src="${item.file}" class="img-fluid">`;
}
else if(item.fileType === 'application/pdf'){
body.innerHTML = `<iframe src="${item.file}" width="100%" height="500px"></iframe>`;
}
else if(item.fileType.startsWith('video/')){
body.innerHTML = `
<video controls width="100%">
<source src="${item.file}" type="${item.fileType}">
</video>`;
}
else{
body.innerHTML = `<p>Preview not available. Please download.</p>`;
}

new bootstrap.Modal(document.getElementById('approvedModal')).show();
}

container.innerHTML += `
<div class="col-md-4 mb-3">
<div class="card p-3">
<h6>${item.title}</h6>
<div class="mb-2">${previewContent}</div>
<div>
<button onclick="approve(${index})" class="btn btn-success btn-sm">Approve</button>
<button onclick="reject(${index})" class="btn btn-danger btn-sm">Reject</button>
</div>
</div>
</div>`;
});
}

function approve(index){
const pending = JSON.parse(localStorage.getItem('pendingResources') || '[]');
const approved = JSON.parse(localStorage.getItem('approvedResources') || '[]');
approved.push(pending[index]);
pending.splice(index,1);
localStorage.setItem('pendingResources', JSON.stringify(pending));
localStorage.setItem('approvedResources', JSON.stringify(approved));
showPending();
}

function reject(index){
if(!confirm('Reject this file?')) return;
const pending = JSON.parse(localStorage.getItem('pendingResources') || '[]');
pending.splice(index,1);
localStorage.setItem('pendingResources', JSON.stringify(pending));
showPending();
}

showApproved();
</script>
<!-- Approved Preview Modal -->
<div class="modal fade" id="approvedModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="approvedTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center" id="approvedBody"></div>
    </div>
  </div>
</div>
</body>
</html>
