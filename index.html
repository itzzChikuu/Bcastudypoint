```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BCAStudyPoint Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
color:white;
min-height:100vh;
overflow-x:hidden;
}

/* VIDEO BACKGROUND */

#bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.65);
z-index:-1;
}

/* NAVBAR */

.navbar{
position:sticky;
top:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
font-size:20px;
font-weight:600;
color:#38bdf8;
}

.logout-btn{
padding:8px 20px;
border-radius:20px;
border:none;
background:linear-gradient(135deg,#ef4444,#f97316);
color:white;
cursor:pointer;
font-size:13px;
box-shadow:0 0 10px rgba(239,68,68,0.6);
}

/* HEADING */

h1{
margin-top:30px;
text-align:center;
font-size:34px;
}

p{
text-align:center;
color:#e2ce5a;
margin-top:6px;
}

/* DASHBOARD CARDS */

.dashboard-cards{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
margin-top:40px;
}

.card{
width:200px;
padding:25px;
border-radius:18px;
text-align:center;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(56,189,248,0.3);
transition:0.3s;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 0 30px rgba(56,189,248,0.8);
}

.card h3{
font-size:28px;
color:#38bdf8;
margin-bottom:8px;
}

.card p{
color:#ddd;
font-size:14px;
}

/* FILTERS */

.filters{
display:flex;
justify-content:center;
gap:20px;
margin:40px auto 20px;
flex-wrap:wrap;
}

.filters select{
padding:14px 22px;
border-radius:20px;
border:none;
background:rgba(5,44,218,0.9);
color:#fff;
font-size:15px;
cursor:pointer;
box-shadow:0 0 18px rgba(56,189,248,0.6);
outline:none;
}

/* ACTION BUTTONS */

.actions{
display:none;
text-align:center;
margin-top:30px;
}

.actions button{
padding:14px 30px;
margin:10px;
border-radius:30px;
border:none;
background:linear-gradient(135deg,#2563eb,#38bdf8);
color:white;
font-size:15px;
cursor:pointer;
box-shadow:0 0 22px rgba(56,189,248,0.7);
}

.actions button:hover{
transform:scale(1.08);
}

/* RESOURCE BUTTON */

.resource-btn{
display:block;
margin:40px auto;
width:260px;
text-align:center;
padding:15px;
background:linear-gradient(135deg,#7b2cbf,#9d4edd);
border-radius:30px;
text-decoration:none;
color:white;
box-shadow:0 0 20px rgba(157,78,221,0.6);
}

</style>
</head>

<body>

<script>

if(localStorage.getItem("loggedIn")!=="true"){
window.location.replace("https://itzzchikuu.github.io/studypoint/");
}

function logout(){
localStorage.removeItem("loggedIn");
window.location.replace("https://itzzchikuu.github.io/studypoint/");
}

</script>

<video autoplay muted loop playsinline id="bg-video">
<source src="gridmotion.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">🎓 BCAStudyPoint</div>

<button class="logout-btn" onclick="logout()">Logout</button>

</div>

<h1>All BCA Resources. One Smart Hub.</h1>
<p>Semester-wise • Subject-wise • Free PDFs</p>

<!-- DASHBOARD CARDS -->

<div class="dashboard-cards">

<div class="card">
<h3>24+</h3>
<p>Subjects</p>
</div>

<div class="card">
<h3>100+</h3>
<p>Study Notes</p>
</div>

<div class="card">
<h3>60+</h3>
<p>Past Papers</p>
</div>

<div class="card">
<h3>40+</h3>
<p>Video Lectures</p>
</div>

</div>

<!-- DROPDOWNS -->

<div class="filters">

<select id="semester">
<option value="">Select Semester</option>
<option value="sem1">Semester 1</option>
<option value="sem2">Semester 2</option>
<option value="sem3">Semester 3</option>
<option value="sem4">Semester 4</option>
</select>

<select id="subject">
<option value="">Select Subject</option>
</select>

<select id="resource">
<option value="">Select Resource</option>
<option value="notes">Notes</option>
<option value="syllabus">Syllabus</option>
<option value="papers">Past Papers</option>
<option value="videos">Video Lectures</option>
</select>

</div>

<a href="resources.html" class="resource-btn">
📂 Upload and View More Resources
</a>

<div class="actions" id="actions">
<button onclick="openPDF()">📖 Open PDF</button>
<button onclick="downloadPDF()">⬇ Download PDF</button>
</div>

<script>

const subjectsBySem={
sem1:[
{value:"dm",text:"Discrete Mathematics"},
{value:"cf",text:"Computer Fundamental"},
{value:"os",text:"Operating System"}
],

sem2:[
{value:"de",text:"Digital Electronics"},
{value:"c",text:"Programming in C++"},
{value:"ds",text:"Data Structure"}
],

sem3:[
{value:"rdbms",text:"RDBMS"},
{value:"se",text:"Software Engineering"},
{value:"java",text:"Programming in Java"}
],

sem4:[
{value:"toc",text:"Theory of Computation"},
{value:"wt",text:"Web Technology"},
{value:"python",text:"Python Programming"}
]
};

const semester=document.getElementById("semester");
const subject=document.getElementById("subject");
const resource=document.getElementById("resource");
const actions=document.getElementById("actions");

semester.addEventListener("change",()=>{

subject.innerHTML='<option value="">Select Subject</option>';
resource.value="";
actions.style.display="none";

if(!semester.value) return;

subjectsBySem[semester.value].forEach(s=>{
const opt=document.createElement("option");
opt.value=s.value;
opt.textContent=s.text;
subject.appendChild(opt);
});

});

subject.addEventListener("change",checkAll);
resource.addEventListener("change",checkAll);

function checkAll(){

if(semester.value && subject.value && resource.value){

if(resource.value==="videos"){
openYouTube();
actions.style.display="none";
return;
}

actions.style.display="block";

}

}

function openPDF(){
alert("PDF link yaha add karo");
}

function downloadPDF(){
alert("Download link yaha add karo");
}

const youtubeLinks={
sem1:{
dm:"https://youtu.be/p2b2Vb-cYCs",
cf:"https://youtu.be/qukBBTS3RII",
os:"https://www.youtube.com/live/By6lWjiPpVI"
},
sem2:{
de:"https://youtu.be/DBTna2ydmC0",
c:"https://youtu.be/Cyha_W_gPdg",
ds:"https://youtu.be/qNGyI95E5AE"
},
sem3:{
rdbms:"https://youtu.be/6Iu45VZGQDk",
se:"https://youtu.be/aa8D33B6yv8",
java:"https://youtu.be/yRpLlJmRo2w"
},
sem4:{
toc:"https://youtu.be/iD6u_2iNnu0",
wt:"https://youtu.be/l1EssrLxt7E",
python:"https://youtu.be/t2_Q2BRzeEE"
}
};

function openYouTube(){
const link=youtubeLinks[semester.value][subject.value];
window.open(link,"_blank");
}

</script>

</body>
</html>
```
