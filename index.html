<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BCAStudyPoint Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
min-height:100vh;
overflow:hidden;
}

/* VIDEO BACKGROUND */
#bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(2,6,23,0.75);
z-index:-1;
}

/* ================= LAYOUT ================= */
.dashboard{
display:flex;
height:100vh;
}

/* SIDEBAR */
.sidebar{
width:240px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border-right:1px solid rgba(255,255,255,0.08);
padding:25px;
}

.logo{
color:#38bdf8;
font-size:20px;
font-weight:600;
margin-bottom:40px;
}

.menu a{
display:block;
padding:12px;
margin:8px 0;
text-decoration:none;
color:white;
border-radius:10px;
transition:.3s;
}

.menu a:hover{
background:#2563eb;
}

/* MAIN */
.main{
flex:1;
padding:30px 40px;
overflow:auto;
}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.logout-btn{
padding:10px 22px;
border-radius:20px;
border:none;
background:linear-gradient(135deg,#ef4444,#f97316);
color:white;
cursor:pointer;
}

/* CARD */
.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(18px);
padding:35px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,0,0,0.4);
text-align:center;
}

.card h1{
margin-bottom:10px;
}

.card p{
color:#e2ce5a;
margin-bottom:25px;
}

/* FILTERS */
.filters{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

select{
padding:14px 22px;
border-radius:20px;
border:none;
background:#1e293b;
color:white;
font-size:15px;
outline:none;
}

/* BUTTONS */
.actions{
display:none;
margin-top:25px;
}

.actions button{
padding:14px 30px;
margin:10px;
border-radius:30px;
border:none;
background:linear-gradient(135deg,#2563eb,#38bdf8);
color:white;
cursor:pointer;
box-shadow:0 0 22px rgba(56,189,248,0.7);
transition:.2s;
}

.actions button:hover{
transform:scale(1.08);
}

/* MOBILE */
@media(max-width:800px){
.sidebar{display:none;}
.main{padding:20px;}
}

</style>
</head>

<script>
if(localStorage.getItem("loggedIn")!=="true"){

window.location.replace("https://itzzchikuu.github.io/studypoint/");
}

subject.addEventListener("change", checkAll);
resource.addEventListener("change", checkAll);

function checkAll() {
  if (semester.value && subject.value && resource.value) {

    if (resource.value === "videos") {
      actions.style.display = "none";
      openYouTube();
      return;
    }

    actions.style.display = "block";
  }
}


function getPDFPath() {
  return `pdfs/${semester.value}/${subject.value}_${resource.value}.pdf`;
}

function openPDF() {
  try {
    const link = pdfLinks[semester.value][subject.value][resource.value].view;
    window.open(link, "_blank");
  } catch {
    alert("📄 Ye PDF abhi available nahi hai");
  }
}

function downloadPDF() {
  try {
    const link = pdfLinks[semester.value][subject.value][resource.value].download;
    window.open(link, "_blank");
  } catch {
    alert("⬇️ Download abhi available nahi hai");
  }
}

  const link = youtubeLinks[semester.value][subject.value];
