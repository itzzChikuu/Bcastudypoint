<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCA Study Point - Admin Approval System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

<style>
body {
  background: #f3f0ff;
  transition: 0.3s;
  font-family: 'Segoe UI', sans-serif;
}

body.dark {
  background: #0f0c1a;
  color: white;
}

/* Sidebar */
.sidebar {
  height: 100vh;
  background: linear-gradient(180deg, #6f42c1, #4b0082);
  color: white;
  padding: 20px;
}

.sidebar h4 {
  font-weight: bold;
}

.sidebar a {
  color: #e0d4ff;
  text-decoration: none;
  display: block;
  margin: 12px 0;
  padding: 8px;
  border-radius: 8px;
  transition: 0.3s;
}

.sidebar a:hover {
  background: rgba(255,255,255,0.2);
  color: white;
}

/* Cards */
.card {
  border-radius: 15px;
  transition: 0.3s;
  border: none;
  background: white;
  box-shadow: 0 8px 20px rgba(111,66,193,0.15);
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 30px rgba(111,66,193,0.25);
}

.dark .card {
  background: #1c1530;
  color: white;
}

/* Buttons */
.btn-primary {
  background: #6f42c1;
  border: none;
}

.btn-primary:hover {
  background: #5a32a3;
}

.btn-success {
  background: #7b2cbf;
  border: none;
}

.btn-success:hover {
  background: #5a189a;
}

.btn-warning {
  background: #9d4edd;
  border: none;
  color: white;
}

.btn-warning:hover {
  background: #7b2cbf;
}

/* Admin badge */
.admin-badge {
  font-size: 12px;
  background: #ff4d6d;
  color: white;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="container-fluid">
<div class="row">

<div class="col-md-2 sidebar">
<h4>BCA Study Point</h4>
<hr>
<a onclick="showApproved()"><i class="fas fa-book"></i> Approved Resources</a>
<a onclick="showPending()"><i class="fas fa-clock"></i> Pending (Admin)</a>
<button class="btn btn-light btn-sm mt-3" onclick="toggleDark()">🌙 Dark Mode</button>
<button class="btn btn-warning btn-sm mt-2" onclick="adminLogin()">Admin Login</button>
<div id="adminStatus" class="mt-2"></div>
</div>

<div class="col-md-10 p-4">
  <div class="mb-3">
  <a href="index.html" class="btn btn-secondary">
    <i class="fas fa-arrow-left"></i> Back to Dashboard
  </a>
</div>
<h2 class="mb-4">Upload (Admin Approval Required)</h2>

<div class="card p-4 mb-4">
<input type="text" id="title" class="form-control mb-2" placeholder="Enter Title" required>
<input type="file" id="file" class="form-control mb-2" required>
<button onclick="submitForApproval()" class="btn btn-primary">Submit</button>
<p class="text-muted mt-2">File will be visible after admin approval.</p>
</div>

<div id="resourceContainer" class="row"></div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC3cP8uM9sbK2SbiYxwv343Sr_RL2Q5k30",
  authDomain: "upload-8949e.firebaseapp.com",
  projectId: "upload-8949e",
  storageBucket: "upload-8949e.firebasestorage.app",
  messagingSenderId: "667330498876",
  appId: "1:667330498876:web:8dffa69eb60d0c159f0e39",
  measurementId: "G-501QNMK281"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const db = getFirestore(app);

// 🔥 Permanent Upload
window.submitForApproval = async function(){

const title = document.getElementById('title').value;
const file = document.getElementById('file').files[0];

if(!file || !title){
alert("Fill all fields");
return;
}

const storageRef = ref(storage, "pending/" + file.name);
await uploadBytes(storageRef, file);
const downloadURL = await getDownloadURL(storageRef);

await addDoc(collection(db, "pendingResources"), {
title: title,
fileURL: downloadURL,
fileType: file.type,
status: "pending"
});

alert("File Uploaded Permanently ✅");

document.getElementById('title').value="";
document.getElementById('file').value="";
}

// 🔥 Show Approved
window.showApproved = async function(){

const container = document.getElementById('resourceContainer');
container.innerHTML="";

const querySnapshot = await getDocs(collection(db, "approvedResources"));

querySnapshot.forEach((doc) => {

const data = doc.data();

container.innerHTML += `
<div class="col-md-3 mb-3">
<div class="card p-3">
<h6>${data.title}</h6>

<div class="mt-2 d-flex justify-content-between">
<a href="${data.fileURL}" target="_blank" class="btn btn-primary btn-sm">View</a>
<a href="${data.fileURL}" download class="btn btn-success btn-sm">Download</a>
</div>

</div>
</div>`;

});
}

showApproved();

</script>
<!-- Approved Preview Modal -->
<div class="modal fade" id="approvedModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="approvedTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center" id="approvedBody"></div>
    </div>
  </div>
</div>
</body>
</html>
