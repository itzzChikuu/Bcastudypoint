<option value="">Select Semester</option>
<option value="sem1">Semester 1</option>
<option value="sem2">Semester 2</option>
<option value="sem3">Semester 3</option>
<option value="sem4">Semester 4</option>
</select>

<br>

<select id="subject">
<option value="">Select Subject</option>
</select>

<br>

<select id="resource">
<option value="">Select Resource</option>
<option value="notes">Notes</option>
<option value="syllabus">Syllabus</option>

</select>

sem1:["dm","cf","os"],
sem2:["de","c","ds"],
sem3:["rdbms","se","java"],
sem4:["toc","wt","python"]
};

const semester=document.getElementById("semester");
const subject=document.getElementById("subject");

semester.addEventListener("change",()=>{

subject.innerHTML='<option value="">Select Subject</option>';

if(!semester.value) return;

subjectsBySem[semester.value].forEach(sub=>{
let opt=document.createElement("option");
opt.value=sub;
opt.textContent=sub.toUpperCase();
subject.appendChild(opt);
});
});

/* ================= MAIN FUNCTION ================= */

function openResource(){

const sem=semester.value;
const sub=subject.value;
const res=document.getElementById("resource").value;

if(!sem || !sub || !res){
alert("Please select all options");
return;
}

try{

if(res==="videos"){
window.open(youtubeLinks[sem][sub],"_blank");
return;
}

window.open(pdfLinks[sem][sub][res].view,"_blank");

}catch{
alert("Resource not available yet");
}

}
